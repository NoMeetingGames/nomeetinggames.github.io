<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NoMeeting Games</title>
<style>
:root{--bg:#f7f4ec;--fg:#1d2230;--mute:#5b6275;--acc:#2a4a9a;--line:#d9d3c3}
@media (prefers-color-scheme:dark){:root{--bg:#12162a;--fg:#ebe7d8;--mute:#9aa2bb;--acc:#8fb0ff;--line:#2b3253}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:40rem;margin:0 auto;padding:3rem max(1rem,env(safe-area-inset-right)) 3rem max(1rem,env(safe-area-inset-left))}
h1{font-size:2rem;margin:0 0 .25rem}
.sub{color:var(--mute);margin:0 0 2rem}
.card{border:1px solid var(--line);border-radius:.7rem;padding:1rem 1.2rem;margin-bottom:1rem}
.card h2{margin:0 0 .25rem;font-size:1.2rem}
a{color:var(--acc)}
</style>
</head>
<body>
<main>
<h1>NoMeeting Games</h1>
<p class="sub">Small casual games, made with care.</p>
<div class="card">
<h2>MAGNET</h2>
<p>A relaxing magnet puzzle game for Android.</p>
<p><a href="https://nomeetinggames.github.io/magnet-privacy/">Privacy policy / Polityka prywatności</a></p>
</div>
<p class="sub">Contact: <a href="mailto:nomeetinggames@gmail.com">nomeetinggames@gmail.com</a></p>
</main>
</body>
</html>
